<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanry 每日日报 | AI 与具身智能</title>
  <link rel="alternate" type="application/rss+xml" title="Fanry 每日日报 RSS" href="feed.xml" />
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent2: #f78166;
      --link: #58a6ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      min-height: 100vh;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Hero */
    .hero {
      text-align: center;
      padding: 64px 24px 48px;
      border-bottom: 1px solid var(--border);
    }
    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      color: var(--muted);
      font-size: 16px;
      max-width: 560px;
      margin: 0 auto 24px;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .btn-rss {
      background: #1f6feb22;
      color: #79c0ff;
      border-color: #1f6feb44;
    }
    .btn-rss:hover { background: #1f6feb33; text-decoration: none; }
    .btn-github {
      background: var(--card);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-github:hover { border-color: var(--accent); text-decoration: none; }

    /* Stats */
    .stats {
      display: flex;
      gap: 32px;
      justify-content: center;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .stat {
      text-align: center;
    }
    .stat .num {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
    }
    .stat .label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Reports list */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 32px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .section-header h2 {
      font-size: 20px;
      font-weight: 700;
    }
    .section-header .updated {
      font-size: 13px;
      color: var(--muted);
    }

    .report-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      margin-bottom: 16px;
      transition: border-color 0.2s, transform 0.1s;
      text-decoration: none;
      color: inherit;
    }
    .report-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      text-decoration: none;
    }
    .report-card .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .report-card .date-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1f6feb22;
      color: #79c0ff;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .report-card .cat-tag {
      display: inline-flex;
      align-items: center;
      background: #f7816622;
      color: #ffa657;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .report-card h3 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .report-card .preview {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .report-card .arrow {
      display: inline-flex;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 48px 0;
      color: var(--muted);
    }
    .loading .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 32px 24px 48px;
      border-top: 1px solid var(--border);
      margin-top: 32px;
    }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

<div class="hero">
  <h1>Fanry 每日日报</h1>
  <p>每日 AI 行业新闻简报 + 具身智能行业热点新闻，聚焦技术进展与商业动态</p>
  <div class="hero-actions">
    <a class="btn btn-rss" href="feed.xml">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3.46 2.5a.75.75 0 00-.964-.414l-.46.165a.75.75 0 00.55 1.398l.46-.165A.75.75 0 003.46 2.5zM2.25 5.5a.75.75 0 000 1.5c2.683 0 4.875 2.182 4.875 4.875a.75.75 0 001.5 0A6.375 6.375 0 002.25 5.5zM2.25 8.75a.75.75 0 000 1.5c.621 0 1.125.504 1.125 1.125a.75.75 0 001.5 0A2.625 2.625 0 002.25 8.75zM2.25 11.75a.75.75 0 000 1.5 1.5 1.5 0 001.5-1.5.75.75 0 00-1.5 0zM3.46 6.025a.75.75 0 00-.964-.414l-.46.165a.75.75 0 00.55 1.398l.46-.165a.75.75 0 00.414-.984z"/></svg>
      RSS 订阅
    </a>
    <a class="btn btn-github" href="https://github.com/fanrydavid/fanry-daily" target="_blank">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="num" id="stat-reports">-</div>
      <div class="label">期日报</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-news">-</div>
      <div class="label">条新闻</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-sources">-</div>
      <div class="label">个来源</div>
    </div>
  </div>
</div>

<div class="container">
  <div class="section-header">
    <h2>历史日报</h2>
    <span class="updated" id="last-updated">加载中...</span>
  </div>
  <div id="reports-list">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载日报列表...</p>
    </div>
  </div>
</div>

<footer>
  <p>Fanry 每日日报 &copy; 2026 &middot; <a href="feed.xml">RSS Feed</a> &middot; <a href="https://github.com/fanrydavid/fanry-daily">GitHub</a></p>
  <p style="margin-top:8px;">由 TRAE 定时任务自动生成与推送</p>
</footer>

<script>
(async function() {
  try {
    const res = await fetch('feed.xml');
    const text = await res.text();
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'text/xml');

    const channel = xml.querySelector('channel');
    const items = xml.querySelectorAll('item');

    // Update last build date
    const lastBuild = channel.querySelector('lastBuildDate');
    if (lastBuild) {
      const d = new Date(lastBuild.textContent);
      document.getElementById('last-updated').textContent = '最后更新：' + d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // Stats
    let totalNews = 0;
    let sources = new Set();
    items.forEach(item => {
      const desc = item.querySelector('description');
      if (desc) {
        const html = desc.textContent;
        const matches = html.match(/<strong>\s*\d+/g);
        if (matches) totalNews += matches.length;
        const linkMatches = html.match(/href="([^"]+)"/g);
        if (linkMatches) linkMatches.forEach(m => sources.add(m));
      }
    });
    document.getElementById('stat-reports').textContent = items.length;
    document.getElementById('stat-news').textContent = totalNews;
    document.getElementById('stat-sources').textContent = sources.size;

    // Render cards
    const list = document.getElementById('reports-list');
    list.innerHTML = '';

    items.forEach((item, idx) => {
      const title = item.querySelector('title')?.textContent || '';
      const link = item.querySelector('link')?.textContent || '#';
      const pubDate = item.querySelector('pubDate')?.textContent || '';
      const desc = item.querySelector('description')?.textContent || '';
      const cats = item.querySelectorAll('category');
      const catNames = Array.from(cats).map(c => c.textContent).join(' · ');

      // Extract date from title or pubDate
      const dateMatch = title.match(/(\d{4}-\d{2}-\d{2})/);
      const dateStr = dateMatch ? dateMatch[1] : '';

      // Extract headline keywords from title (after the date)
      const headline = title.replace(/Fanry 日报 \d{4}-\d{2}-\d{2} \| /, '');

      // Build preview from description: extract first 2 news titles
      const tmp = document.createElement('div');
      tmp.innerHTML = desc;
      const strongs = tmp.querySelectorAll('strong');
      let preview = '';
      if (strongs.length >= 2) {
        preview = strongs[0].textContent + '；' + strongs[1].textContent + '...';
      } else if (strongs.length === 1) {
        preview = strongs[0].textContent + '...';
      } else {
        preview = desc.substring(0, 120) + '...';
      }

      // Format date
      let formattedDate = dateStr;
      if (pubDate) {
        const d = new Date(pubDate);
        const weekdays = ['日','一','二','三','四','五','六'];
        formattedDate = dateStr + ' 星期' + weekdays[d.getDay()];
      }

      const card = document.createElement('a');
      card.className = 'report-card';
      card.href = link.includes('fanrydavid.github.io') ? link.replace('https://fanrydavid.github.io/fanry-daily/', '') : link;

      let catTags = '';
      if (catNames) {
        catNames.split(' · ').forEach(cat => {
          if (cat === '具身智能') {
            catTags += '<span class="cat-tag">' + cat + '</span>';
          } else {
            catTags += '<span class="date-tag">' + cat + '</span>';
          }
        });
      }

      card.innerHTML = `
        <div class="card-top">
          <span class="date-tag">${formattedDate}</span>
          ${catTags}
        </div>
        <h3>${headline}</h3>
        <p class="preview">${preview}</p>
        <span class="arrow">阅读全文 &rarr;</span>
      `;
      list.appendChild(card);
    });

    if (items.length === 0) {
      list.innerHTML = '<p style="text-align:center;color:var(--muted);padding:48px 0;">暂无日报</p>';
    }
  } catch (e) {
    document.getElementById('reports-list').innerHTML =
      '<p style="text-align:center;color:var(--muted);padding:48px 0;">加载失败，请稍后刷新页面</p>';
    console.error(e);
  }
})();
</script>

</body>
</html>
